name: ods_app
description: ODS — Zero Distance Services
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + navigation (used from 1.5 / 1.8)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # HTTP client (used from 1.4)
  dio: ^5.5.0

  # Secure token storage (used from 1.8)
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/